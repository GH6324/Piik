<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>frame</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9c4b8; }
  body { display: grid; place-items: center; }
  .device {
    width: 390px; height: 844px;
    border: 10px solid #1d2026;
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="device"><iframe id="view" title="phone"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("src") ?? "../index.html";
  document.getElementById("view").src = "../" + src;
</script>
</body>
</html>
