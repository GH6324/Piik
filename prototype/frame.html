<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener 手机预览</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; padding: 24px 16px;
    display: grid; place-items: center; gap: 14px;
    background: #b9b3a6; color: #20242e;
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .hint { font-size: 12.5px; opacity: .72; }
  .hint a { color: inherit; }
  .device {
    width: 390px; height: 844px;
    max-height: calc(100dvh - 80px);
    border: 10px solid #1d2026;
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,.3);
    display: grid;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="device"><iframe id="view" title="手机预览"></iframe></div>
<p class="hint">390 × 844 手机视口 · 交互与真实手机一致 · <a href="index.html" id="back">返回原型目录</a></p>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("src") ?? "index.html";
  document.getElementById("view").src = "./" + src;
  document.getElementById("back").href = "index.html" + (q.get("lang") ? "?lang=" + q.get("lang") : "");
</script>
</body>
</html>
